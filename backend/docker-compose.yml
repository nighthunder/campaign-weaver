services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: campaign-weaver-app
    container_name: campaign-weaver-app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - ./.env
    volumes:
      - ./:/var/www
      - ./vendor:/var/www/vendor
      - ./storage:/var/www/storage
    depends_on:
      - db
      - redis
    networks:
      - app-network

  nginx:
    image: nginx:1.24-alpine
    container_name: campaign-weaver-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: campaign-weaver-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: campaign_db
      MYSQL_USER: campaign
      MYSQL_PASSWORD: campaign
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: campaign-weaver-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  worker1:
    build:
      context: .
      dockerfile: Dockerfile
    image: campaign-weaver-worker-default
    container_name: campaign-weaver-worker-1
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - ./.env
    volumes:
      - ./:/var/www
      - ./vendor:/var/www/vendor
      - ./storage:/var/www/storage
    command: php artisan queue:work redis --queue=default --sleep=3 --tries=3 --timeout=90 --max-jobs=1000 --max-time=3600
    depends_on:
      - db
      - redis
    networks:
      - app-network

  worker2:
    build:
      context: .
      dockerfile: Dockerfile
    image: campaign-weaver-worker-mails
    container_name: campaign-weaver-worker-2
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - ./.env
    volumes:
      - ./:/var/www
      - ./vendor:/var/www/vendor
      - ./storage:/var/www/storage
    command: php artisan queue:work redis --queue=mails,default --sleep=1 --tries=5 --timeout=120 --max-jobs=500 --max-time=3600
    depends_on:
      - db
      - redis
    networks:
      - app-network

  worker3:
    build:
      context: .
      dockerfile: Dockerfile
    image: campaign-weaver-worker-reports
    container_name: campaign-weaver-worker-3
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - ./.env
    volumes:
      - ./:/var/www
      - ./vendor:/var/www/vendor
      - ./storage:/var/www/storage
    command: php artisan queue:work redis --queue=reports --sleep=5 --tries=2 --timeout=300
    depends_on:
      - db
      - redis
    networks:
      - app-network

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    image: campaign-weaver-horizon
    container_name: campaign-weaver-horizon
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - ./.env
    volumes:
      - ./:/var/www
      - ./vendor:/var/www/vendor
      - ./storage:/var/www/storage
    command: php artisan horizon
    depends_on:
      - redis
      - db
    networks:
      - app-network

volumes:
  dbdata:
  redisdata:

networks:
  app-network:
    driver: bridge
